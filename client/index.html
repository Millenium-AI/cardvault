<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Trading card inventory and valuation tracker" />

    <!-- PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CardVault" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="76x76"   href="/apple-touch-icon-76.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!--
      Splash screens
      IMPORTANT: All media queries MUST include (orientation: portrait).
      WebKit silently ignores apple-touch-startup-image without it.
      Physical pixel sizes are noted for PNG generation reference.
    -->

    <!-- iPhone SE 3rd gen — 750×1334 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/iphonese.png" />

    <!-- iPhone 14 Pro — 1179×2556 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone14pro.png" />

    <!-- iPhone 14 Pro Max — 1290×2796 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone14promax.png" />

    <!-- iPhone 16 Pro — 1206×2622 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone16pro.png" />

    <!-- iPhone 16 Pro Max — 1320×2868 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash/iphone16promax.png" />

    <!-- iPad Pro 12.9" (2x) — 2048×2732 physical -->
    <link rel="apple-touch-startup-image"
      media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/splash/vertsplashipad.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts — only fonts referenced in index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
